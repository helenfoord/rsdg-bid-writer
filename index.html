function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function fileToContentBlock(file) {
  const type = file.type;
  if (type === 'application/pdf') {
    const data = await readFileAsBase64(file);
    return { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data } };
  }
  if (type.startsWith('image/')) {
    const data = await readFileAsBase64(file);
    return { type: 'image', source: { type: 'base64', media_type: type, data } };
  }
  if (
    type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
    file.name.toLowerCase().endsWith('.docx')
  ) {
    // mammoth is loaded globally via a <script> tag in index.html
    const arrayBuffer = await file.arrayBuffer();
    const { value } = await mammoth.extractRawText({ arrayBuffer });
    return { type: 'text', text: `[Uploaded file: ${file.name}]\n${value}` };
  }
  // plain text / fallback
  const text = await file.text();
  return { type: 'text', text: `[Uploaded file: ${file.name}]\n${text}` };
}

function FileDrop({ label, files, setFiles, multiple }) {
  const inputRef = useRef(null);
  const onChange = (e) => {
    const picked = Array.from(e.target.files || []);
    setFiles(multiple ? [...files, ...picked] : picked.slice(0, 1));
    e.target.value = '';
  };
  return (
    <div>
      <button
        type="button"
        onClick={() => inputRef.current?.click()}
        style={{
          display: 'flex',
          alignItems: 'center',
          gap: 8,
          border: `1.5px dashed ${COLORS.blue}55`,
          background: '#f7fafc',
          borderRadius: 4,
          padding: '10px 14px',
          color: COLORS.blue,
          fontWeight: 600,
          fontSize: 14,
          cursor: 'pointer',
          width: '100%',
          textAlign: 'left',
        }}
      >
        <Upload size={16} />
        {label}
      </button>
      <input
        ref={inputRef}
        type="file"
        multiple={multiple}
        onChange={onChange}
        style={{ display: 'none' }}
        accept=".pdf,.docx,.doc,.png,.jpg,.jpeg,.txt"
      />
      {files.length > 0 && (
        <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 4 }}>
          {files.map((f, i) => (
            <div
              key={i}
              style={{
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                fontSize: 13,
                color: COLORS.ink,
                background: '#fff',
                border: '1px solid #e2e8ee',
                borderRadius: 4,
                padding: '5px 10px',
              }}
            >
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</span>
              <button
                type="button"
                onClick={() => setFiles(files.filter((_, idx) => idx !== i))}
                style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#94a3b8', display: 'flex' }}
              >
                <X size={14} />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Field({ label, hint, children }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <label style={{ display: 'block', fontWeight: 700, color: COLORS.blue, fontSize: 14, marginBottom: 4 }}>

      {hint && <div style={{ fontSize: 12.5, color: '#5b7183', marginBottom: 6, fontWeight: 300 }}>{hint}</div>}
      {children}
    </div>
  );
}

    const fileBlocks = [];
    for (const f of guidelineFiles) {
      fileBlocks.push({ type: 'text', text: `[This is the funder's own guidelines document: ${f.name}]` });
      fileBlocks.push(await fileToContentBlock(f));
    }
    for (const f of supportFiles) {
      fileBlocks.push({ type: 'text', text: `[This is RSDG supporting material: ${f.name}]` });
      fileBlocks.push(await fileToContentBlock(f));
    }
    return [{ type: 'text', text: textSummary }, ...fileBlocks];
  }

  function questionsBlock() {
    return { type: 'text', text: `FUNDER'S APPLICATION QUESTIONS (answer each in turn, in this order):\n${form.questions}` };
  }

  async function callClaude(content) {
    const response = await fetch('/api/draft', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-5',
        max_tokens: 8192,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content }],
      }),
    });
    const raw = await response.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      throw new Error(
        `Server returned something that wasn't JSON (HTTP ${response.status}). Actual response, first 400 characters: ${
          raw ? raw.slice(0, 400) : '(completely empty response body)'
        }`
      );
    }
    if (!response.ok || data.type === 'error') {
      const detail =
        (data && data.error && (data.error.message || JSON.stringify(data.error))) ||
        (data && data.detail) ||
        JSON.stringify(data).slice(0, 400);
      throw new Error(`API error (HTTP ${response.status}): ${detail}`);
    }
    const textParts = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text);
    if (textParts.length === 0) {
      throw new Error('The response had no text content. Raw response: ' + JSON.stringify(data).slice(0, 400));
    }
    return textParts.join('\n\n');
  }

  async function handleSubmit() {
    setStatus('loading');
    setErrorMsg('');
    try {
      const baseBlocks = await getOriginalContentBlocks();
      const content = [...baseBlocks, questionsBlock()];
      const draft = await callClaude(content);
      setAnswers(draft);
      setStatus('done');
      setEverDone(true);
    } catch (err) {
      console.error(err);
      setErrorMsg(err && err.message ? err.message : 'Something went wrong generating the draft. Please try again.');
      setStatus('error');
    }
  }

  async function handleRegenerate() {
    const thisRound = { note: newNote, files: newFiles };
    const updatedRounds = [...extraRounds, thisRound];
    setRegenStatus('loading');
    setErrorMsg('');
    try {
      const baseBlocks = await getOriginalContentBlocks();
      const roundBlocks = [];
      for (let i = 0; i < updatedRounds.length; i++) {
        const r = updatedRounds[i];
        roundBlocks.push({
          type: 'text',
          text: `ADDITIONAL INFORMATION SUPPLIED AFTER DRAFT ${i + 1}:\n${r.note || '(no notes, see attached files)'}`,
        });
        for (const f of r.files) {
          roundBlocks.push({ type: 'text', text: `[Uploaded with this round: ${f.name}]` });
          roundBlocks.push(await fileToContentBlock(f));
        }
      }
      const revisionInstruction = {
        type: 'text',
        text: `This is a revision. The ADDITIONAL INFORMATION above was supplied after seeing the previous draft below. Produce a complete, updated draft that incorporates it, following all ground rules, house standards, the [NEEDS INPUT] flagging, and the mandatory recommendations section. Write the full draft again, not just a list of changes.\n\nPREVIOUS DRAFT:\n${answers}`,
      };
      const content = [...baseBlocks, ...roundBlocks, revisionInstruction, questionsBlock()];
      const draft = await callClaude(content);
      setAnswers(draft);
      setExtraRounds(updatedRounds);
      setNewNote('');
      setNewFiles([]);
      setAddingInfo(false);
      setDraftNumber((n) => n + 1);
      setRegenStatus('idle');
    } catch (err) {
      console.error(err);
      setErrorMsg(err && err.message ? err.message : 'Something went wrong generating the updated draft. Please try again.');
      setRegenStatus('error');
    }
  }

  function handleCopy() {
    navigator.clipboard.writeText(answers);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  }

  function handleDownload() {
    const blob = new Blob([answers], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `RSDG-bid-draft-${form.funder.replace(/[^a-z0-9]+/gi, '-') || 'draft'}-v${draftNumber}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function handleReset() {
    setForm(initial);
    setGuidelineFiles([]);
    setSupportFiles([]);
    setAnswers('');
    setStatus('idle');
    setEverDone(false);
    setDraftNumber(1);
    setExtraRounds([]);
    setAddingInfo(false);
    setNewNote('');
    setNewFiles([]);
    setRegenStatus('idle');
  }

    <div style={{ maxWidth: 760, margin: '0 auto', padding: '0 24px 60px' }}>
        {!everDone && (
          <div
            style={{

            </Field>
            <Field label="Do you have the funder's guidelines?" hint="Optional, but it helps the draft match what they're actually looking for.">
              <FileDrop label="Upload funder guidelines" files={guidelineFiles} setFiles={setGuidelineFiles} multiple={false} />
            </Field>
            <Field label="Which specific project or piece of work is the funding for?">
              <textarea style={{ ...inputStyle, minHeight: 60, resize: 'vertical' }} value={form.project} onChange={set('project')} placeholder="e.g. Refurbishing the outdoor multi-use games area" />
            </Field>
            <Field label="How much are you asking for, and what does it pay for?">

                <input style={{ ...inputStyle, maxWidth: 140 }} value={form.amount} onChange={set('amount')} placeholder="£ amount" />

              </div>
            </Field>

                    <input

                      name="prior"

                      onChange={() => setForm({ ...form, priorFunding: opt })}
                    />
                    {opt}
                  </label>
                ))}
              </div>
              <input style={inputStyle} value={form.priorFundingDetail} onChange={set('priorFundingDetail')} placeholder="Any detail worth adding (optional)" />
            </Field>
            <Field label="Word or character limit per answer, if the funder sets one">
              <input style={{ ...inputStyle, maxWidth: 220 }} value={form.wordLimit} onChange={set('wordLimit')} placeholder="e.g. 250 words per answer" />

            </Field>

            <SectionTitle n="3" title="The funder's questions" />

                      borderRadius: 5,
                      padding: '10px 20px',

                      fontWeight: 700,

            <div style={{ display: 'flex', gap: 12, marginTop: 26, flexWrap: 'wrap' }}>

                    borderRadius: 5,

                    fontSize: 14,
                    fontWeight: 700,

                  fontSize: 14,

            </div>

        )}

function highlightFlags(text) {
  const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const withFlags = escaped.replace(
    /\[NEEDS INPUT:[^\]]*\]/g,
    (match) =>
      `<span style="background:#fff3cd; color:#7a5b00; padding:1px 5px; border-radius:3px; font-weight:600;">${match}</span>`
  );
  return withFlags.replace(
    /RECOMMENDATIONS TO STRENGTHEN THIS APPLICATION/g,
    `</div><div style="margin-top:28px; padding:18px 20px; background:#f0f9f0; border-left:4px solid ${COLORS.green}; border-radius:4px;"><div style="color:${COLORS.blueDark}; font-weight:800; font-size:14.5px; letter-spacing:0.2px; margin-bottom:10px;">Recommendations to strengthen this application</div>`
  );
}

function parseAmount(amountStr) {
  // Pulls the highest number out of a figure like "£35,000" or "£40,000-£500,000".
  // TBC / discretionary / non-numeric values correctly return 0.
  const matches = String(amountStr).replace(/,/g, '').match(/[\d.]+/g);
  if (!matches) return 0;
  return Math.max(...matches.map(parseFloat));
}

function groupFunders(list) {
  // Preserves first-seen order of each funder name
  const order = [];
  const map = {};
  list.forEach((f) => {
    if (!map[f.name]) {
      map[f.name] = [];
      order.push(f.name);
    }
    map[f.name].push(f);
  });
  return order.map((name) => ({ name, rows: map[name] }));
}

function mergeWithSeed(stored) {
  const seed = seedFunders();
  const key = (r) => `${r.name}|||${r.appliesTo}`;
  const seedByKey = {};
  seed.forEach((r) => {
    seedByKey[key(r)] = r;
  });
  const storedKeys = new Set(stored.map(key));

  // Backfill fields (like the new url column) onto existing rows without touching
  // anything the user has already edited (status, notes, or a url they've set).
  const backfilled = stored.map((r) => {
    const match = seedByKey[key(r)];
    const patch = {};
    if (r.url === undefined) patch.url = (match && match.url) || '';
    if (r.deadline === undefined) patch.deadline = (match && match.deadline) || '';
    return Object.keys(patch).length ? { ...r, ...patch } : r;
  });

  // Add any funds from the current seed list that aren't in storage yet, with ids
  // that can't collide with whatever's already there.
  const usedIds = new Set(backfilled.map((r) => r.id));
  let n = 0;
  const additions = seed
    .filter((r) => !storedKeys.has(key(r)))
    .map((r) => {
      let id = r.id;
      while (usedIds.has(id)) {
        id = `fnew${n++}`;
      }
      usedIds.add(id);
      return { ...r, id };
    });

  return [...backfilled, ...additions];
}

function PipelineTracker() {

  const [showAdd, setShowAdd] = useState(false);
  const [newFunder, setNewFunder] = useState({ name: '', appliesTo: '', amount: '', deadline: '', status: 'Not started', notes: '', url: '' });
  const [expandedId, setExpandedId] = useState(null);
  const [expandedGroups, setExpandedGroups] = useState({});
  const [pdfStatus, setPdfStatus] = useState('idle'); // idle | working | error
  const [pdfErrorDetail, setPdfErrorDetail] = useState('');

  function toggleGroup(name) {
    setExpandedGroups((prev) => ({ ...prev, [name]: !prev[name] }));
  }

  async function pipelineGet() {
    const res = await fetch('/api/pipeline');
    if (!res.ok) {
      const body = await res.text().catch(() => '');
      throw new Error(`Pipeline load failed (HTTP ${res.status}): ${body.slice(0, 300) || 'no detail returned'}`);
    }
    const data = await res.json();
    return data && data.value ? JSON.parse(data.value) : null;
  }

  async function pipelineSet(value) {
    const res = await fetch('/api/pipeline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: JSON.stringify(value) }),
    });
    if (!res.ok) {
      const body = await res.text().catch(() => '');
      throw new Error(`Pipeline save failed (HTTP ${res.status}): ${body.slice(0, 300) || 'no detail returned'}`);
    }
  }

  useEffect(() => {
    (async () => {
      try {
        const value = await pipelineGet();
        if (value && Array.isArray(value) && value.length > 0) {
          const merged = mergeWithSeed(value);
          setFunders(merged);
          if (merged.length !== value.length || JSON.stringify(merged) !== JSON.stringify(value)) {
            await pipelineSet(merged);
          }
        } else {
          const seeded = seedFunders();
          setFunders(seeded);
          await pipelineSet(seeded);
        }
      } catch (err) {
        // Key doesn't exist yet, or storage failed — seed locally and try to save
        console.error(err);
        const seeded = seedFunders();
        setFunders(seeded);
        try {
          await pipelineSet(seeded);
        } catch (e2) {
          console.error(e2);
          setLoadErrorDetail(e2 && e2.message ? e2.message : String(e2));
          setLoadError(true);
        }
      }
    })();
  }, []);

  async function persist(updated) {
    setFunders(updated);
    try {
      await pipelineSet(updated);
    } catch (err) {
      console.error(err);
      setLoadErrorDetail(err && err.message ? err.message : String(err));
      setLoadError(true);
    }
  }

  function updateRow(id, patch) {
    persist(funders.map((f) => (f.id === id ? { ...f, ...patch } : f)));

    persist(funders.filter((f) => f.id !== id));

                    <tr style={{ borderBottom: isGroupOpen ? 'none' : '1px solid #eef2f5', background: '#fbfdfe' }}>
                      <td style={{ padding: '8px 10px', fontWeight: 700, color: COLORS.ink, wordBreak: 'break-word' }}>
                        {name} <span style={{ fontSize: 11, fontWeight: 700, color: '#94a3b8' }}>· {rows.length} asks</span>
                      </td>
                      <td style={{ padding: '8px 10px', color: COLORS.ink, wordBreak: 'break-word', fontWeight: 700 }}>
                        £{total.toLocaleString()}
                        {looksApprox ? '+' : ''} <span style={{ fontWeight: 400, color: '#94a3b8', fontSize: 11.5 }}>combined</span>
                      </td>
                      <td style={{ padding: '8px 10px', color: '#5b7183' }}>—</td>
                      <td style={{ padding: '8px 10px' }}>
                        <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                          {statusSet.map((s) => (
                            <span key={s} style={statusPillStyle(STATUS_COLORS[s])}>
                              {s}
                            </span>
                          ))}
                        </div>
                      </td>
                      <td style={{ padding: '8px 10px', textAlign: 'center', color: '#d7e1e8' }}>—</td>
                      <td style={{ padding: '8px 10px' }}>
                        <button
                          onClick={() => toggleGroup(name)}
                          title={isGroupOpen ? 'Hide the individual asks' : 'Show the individual asks'}
                          style={{
                            border: 'none',
                            background: 'none',
                            color: COLORS.blue,
                            cursor: 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            transform: isGroupOpen ? 'rotate(90deg)' : 'rotate(0deg)',
                            transition: 'transform 0.15s ease',
                          }}
                        >
                          <ChevronRight size={18} />
                        </button>
                      </td>
                    </tr>
                    {isGroupOpen &&
                      rows.map((r) => (
                        <FunderLine key={r.id} f={r} indent expandedId={expandedId} setExpandedId={setExpandedId} updateRow={updateRow} deleteRow={deleteRow} />
                      ))}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>

        {showAdd ? (
          <div style={{ marginTop: 20, padding: 16, background: '#f7fafc', borderRadius: 6, border: '1px solid #e2e8ee' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 10 }}>
              <input style={inputStyle} placeholder="Funder name" value={newFunder.name} onChange={(e) => setNewFunder({ ...newFunder, name: e.target.value })} />
              <input style={inputStyle} placeholder="Amount (e.g. £10,000)" value={newFunder.amount} onChange={(e) => setNewFunder({ ...newFunder, amount: e.target.value })} />
              <input style={inputStyle} placeholder="Applies to" value={newFunder.appliesTo} onChange={(e) => setNewFunder({ ...newFunder, appliesTo: e.target.value })} />
              <input style={inputStyle} placeholder="Deadline, if there is one" value={newFunder.deadline} onChange={(e) => setNewFunder({ ...newFunder, deadline: e.target.value })} />
              <input
                style={{ ...inputStyle, gridColumn: '1 / -1' }}
                placeholder="URL (link to further information)"
                value={newFunder.url}
                onChange={(e) => setNewFunder({ ...newFunder, url: e.target.value })}
              />
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={addRow} style={{ background: COLORS.orange, color: '#fff', border: 'none', borderRadius: 5, padding: '9px 18px', fontWeight: 700, fontSize: 13.5, cursor: 'pointer' }}>
                Add funder
              </button>
              <button onClick={() => setShowAdd(false)} style={{ background: 'none', border: 'none', color: '#5b7183', fontWeight: 600, fontSize: 13.5, cursor: 'pointer' }}>
                Cancel
              </button>
            </div>
          </div>
        ) : (
          <button
            onClick={() => setShowAdd(true)}
            style={{
              marginTop: 18,
              background: 'none',
              border: `1.5px solid ${COLORS.blue}`,
              color: COLORS.blue,
              borderRadius: 5,
              padding: '9px 18px',
              fontWeight: 700,
              fontSize: 13.5,
              cursor: 'pointer',
            }}
          >
            + Add a funder not on this list
          </button>
        )}
      </div>
    </div>
  );
}
